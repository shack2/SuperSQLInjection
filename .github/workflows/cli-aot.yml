# SuperSQLInjectionV2.Cmd 命令行三平台 Native AOT 编译打包
# 手动触发：Actions → cli-aot → Run workflow；产物在 Artifacts
# 也被 release.yml 以 workflow_call 复用（打 tag 发布时自动构建）
# 注：Native AOT 不支持跨 OS 交叉编译，三平台分别用对应 runner 本机编译；
#     清理规则与本地 publish-cli-aot.cmd / publish-cli-aot-linux.sh / publish-cli-aot-osx.sh 一致
name: cli-aot

on:
  workflow_dispatch:
  workflow_call:

env:
  VERSION: 2.0.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest,  rid: linux-x64 }
          - { os: macos-14,       rid: osx-arm64 }   # Apple Silicon；Intel Mac 需 macos-13 + osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 安装 Linux Native AOT 编译依赖
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: 编译命令行 Native AOT（${{ matrix.rid }}）
        run: dotnet publish SuperSQLInjectionV2.Cmd/SuperSQLInjectionV2.Cmd.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:PublishTrimmed=true --self-contained

      - name: 精简产物（去调试符号/图形库/跨平台 quickjs，与本地发布脚本一致）
        shell: bash
        run: |
          PUBDIR="SuperSQLInjectionV2.Cmd/bin/Release/net10.0/${{ matrix.rid }}/publish"
          rm -f "$PUBDIR"/*.pdb "$PUBDIR"/*.dbg "$PUBDIR"/*.dwarf 2>/dev/null || true
          # CLI 不渲染，剔除 Avalonia 图形原生库与非本平台的 quickjs 库
          case "${{ matrix.rid }}" in
            win-x64)   rm -f "$PUBDIR/libSkiaSharp.dll" "$PUBDIR/libHarfBuzzSharp.dll" "$PUBDIR/libquickjs.so" "$PUBDIR/libquickjs.dylib";;
            linux-x64) rm -f "$PUBDIR/libSkiaSharp.so" "$PUBDIR/libHarfBuzzSharp.so" "$PUBDIR/libquickjs.dll" "$PUBDIR/libquickjs.dylib";;
            osx-arm64) rm -f "$PUBDIR/libSkiaSharp.dylib" "$PUBDIR/libHarfBuzzSharp.dylib" "$PUBDIR/libquickjs.dll" "$PUBDIR/libquickjs.so";;
          esac
          rm -rf "$PUBDIR/output"
          ls -la "$PUBDIR"

      - name: 冒烟验证（--version）
        if: runner.os == 'Windows'
        shell: pwsh
        run: '& "SuperSQLInjectionV2.Cmd/bin/Release/net10.0/${{ matrix.rid }}/publish/SuperSQLInjectionV2.Cmd.exe" --version'

      - name: 冒烟验证（--version）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          PUBDIR="SuperSQLInjectionV2.Cmd/bin/Release/net10.0/${{ matrix.rid }}/publish"
          chmod +x "$PUBDIR/SuperSQLInjectionV2.Cmd"
          "$PUBDIR/SuperSQLInjectionV2.Cmd" --version

      - name: 打包 zip（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $pub = "SuperSQLInjectionV2.Cmd/bin/Release/net10.0/${{ matrix.rid }}/publish"
          Compress-Archive -Path "$pub/*" -DestinationPath "dist/SuperSQLInjectionV2.Cmd-$env:VERSION-${{ matrix.rid }}.zip" -Force

      - name: 打包 tar.gz（Linux/macOS）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          PUBDIR="SuperSQLInjectionV2.Cmd/bin/Release/net10.0/${{ matrix.rid }}/publish"
          tar -czf "dist/SuperSQLInjectionV2.Cmd-$VERSION-${{ matrix.rid }}.tar.gz" -C "$PUBDIR" .

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.rid }}
          path: dist/
          retention-days: 30
