# SuperSQLInjectionV2 GitHub Release 发布流水线
# 触发：推送 v* 标签（如 git tag v2.0.0 && git push origin v2.0.0）
# 流程：复用 desktop-aot / cli-aot 两个 workflow 构建 6 个平台包 → 汇总创建 GitHub Release
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 运行发布前单元测试
        run: dotnet test SuperSQLInjectionV2.Tests/SuperSQLInjectionV2.Tests.csproj -c Release
      - name: 校验Tag与程序版本一致
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG_NAME#v}"
          APP_VER=$(python3 -c "import re;print(re.search(r'AppVersion\s*=\s*\"([^\"]+)\"',open('SuperSQLInjectionV2/Models/ConstData.cs').read()).group(1))")
          test "$VER" = "$APP_VER" || { echo "::error::Tag $VER 与 ConstData.AppVersion $APP_VER 不一致"; exit 1; }
          python3 - "$VER" <<'PY'
          import pathlib,re,sys
          ver=sys.argv[1]
          for name in ['SuperSQLInjectionV2/SuperSQLInjectionV2.csproj','SuperSQLInjectionV2.Desktop/SuperSQLInjectionV2.Desktop.csproj','SuperSQLInjectionV2.Cmd/SuperSQLInjectionV2.Cmd.csproj']:
              text=pathlib.Path(name).read_text()
              actual=re.search(r'<Version>([^<]+)</Version>',text).group(1)
              assert actual == ver, f'{name}: {actual} != {ver}'
          PY

  # 桌面端三平台（复用 desktop-aot.yml）
  desktop:
    needs: validate
    uses: ./.github/workflows/desktop-aot.yml

  # 命令行三平台（复用 cli-aot.yml）
  cli:
    needs: validate
    uses: ./.github/workflows/cli-aot.yml

  # 汇总产物并创建 Release
  publish:
    needs: [desktop, cli]
    runs-on: ubuntu-latest
    steps:
      # 只下载正式产物；skill-input-* 是 cli-aot 内部合并 Skill 用的中间文件，不能混入 Release。
      - name: 下载桌面端构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: 'desktop-*'
          path: dist
          merge-multiple: true

      - name: 下载桌面端三平台更新包
        uses: actions/download-artifact@v4
        with:
          pattern: 'update-desktop-*'
          path: update
          merge-multiple: true

      - name: 下载命令行构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: 'cli-*'
          path: dist
          merge-multiple: true

      - name: 下载双平台 Skill 包
        uses: actions/download-artifact@v4
        with:
          name: skill-cli
          path: dist
          merge-multiple: true

      - name: 产物清单
        run: ls -la dist/

      - name: 创建 GitHub Release 并附加安装包
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # 同步桌面端三平台到 SoftUpdate 更新通道（soft.shack2.cn）：逐平台注册草稿 → 发布上线 → 复核。
      # 更新记录通过 os + arch 区分；CMD 暂无更新客户端，不与桌面端共用 appId。
      # 需要在仓库 Secrets 配置：UPDATE_SERVER_URL（如 http://soft.shack2.cn）、UPDATE_API_KEY（服务端 data/admin-apikey.txt）
      - name: 同步桌面端三平台到 SoftUpdate 更新通道
        env:
          UPDATE_SERVER: ${{ secrets.UPDATE_SERVER_URL }}
          UPDATE_KEY: ${{ secrets.UPDATE_API_KEY }}
          TAG_NAME: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ -z "$UPDATE_SERVER" ] || [ -z "$UPDATE_KEY" ]; then
            echo "::error::必须配置 UPDATE_SERVER_URL / UPDATE_API_KEY Secrets，禁止发布流程静默跳过更新通道"
            exit 1
          fi
          VER="${TAG_NAME#v}"
          for SPEC in "windows x64 win-x64" "linux x64 linux-x64" "osx arm64 osx-arm64"; do
            read -r OS ARCH RID <<< "$SPEC"
            PACKAGE="update/SuperSQLInjectionV2-$VER-desktop-$RID.zip"
            if [ ! -f "$PACKAGE" ]; then
              echo "::error::缺少 $OS-$ARCH 更新包：$PACKAGE"
              exit 1
            fi

            # 同一版本重复发布时保持幂等：已发布则复核跳过，草稿则续发，缺失才创建。
            EXISTING=$(curl -sS --fail-with-body "$UPDATE_SERVER/api/admin/releases?appId=supersqlinjection" -H "X-Api-Key: $UPDATE_KEY" \
              | VER="$VER" OS="$OS" ARCH="$ARCH" python3 -c 'import json,sys,os; data=json.load(sys.stdin); rows=data if isinstance(data,list) else data.get("items",data.get("data",[])); matches=[r for r in rows if r.get("version")==os.environ["VER"] and r.get("os")==os.environ["OS"] and r.get("arch")==os.environ["ARCH"]]; r=max(matches,key=lambda x:int(x.get("id",0))) if matches else None; published=bool(r and (r.get("published") or r.get("isPublished") or r.get("publishedAtUtc") or str(r.get("status","")).lower()=="published")); print("{} {}".format(r["id"], str(published).lower())) if r else None')
            ID=""
            ALREADY_PUBLISHED=false
            if [ -n "$EXISTING" ]; then
              read -r ID ALREADY_PUBLISHED <<< "$EXISTING"
              echo "发现 $VER ($OS-$ARCH) 已有记录 ID=$ID，发布状态=$ALREADY_PUBLISHED"
            else
              echo "创建 $VER ($OS-$ARCH) 更新记录（包：$PACKAGE）"
              RESP=$(curl -sS --fail-with-body -X POST "$UPDATE_SERVER/api/admin/releases" \
                -H "X-Api-Key: $UPDATE_KEY" \
                -F appId=supersqlinjection -F "version=$VER" -F channel=stable \
                -F "os=$OS" -F "arch=$ARCH" -F mandatory=false \
                -F "notes=$COMMIT_MSG" \
                -F "files=@$PACKAGE")
              echo "$RESP"
              ID=$(echo "$RESP" | python3 -c "import json,sys;print(json.load(sys.stdin)['id'])")
            fi
            if [ "$ALREADY_PUBLISHED" != "true" ]; then
              curl -sS --fail-with-body -X POST "$UPDATE_SERVER/api/admin/releases/$ID/publish" -H "X-Api-Key: $UPDATE_KEY"
            fi
            curl -sS --fail-with-body "$UPDATE_SERVER/api/admin/releases?appId=supersqlinjection" -H "X-Api-Key: $UPDATE_KEY" \
              | ID="$ID" VER="$VER" OS="$OS" ARCH="$ARCH" python3 -c 'import json,sys,os; data=json.load(sys.stdin); rows=data if isinstance(data,list) else data.get("items",data.get("data",[])); rid=int(os.environ["ID"]); ver=os.environ["VER"]; platform=os.environ["OS"]; arch=os.environ["ARCH"]; assert any(str(r.get("id"))==str(rid) and r.get("version")==ver and r.get("os")==platform and r.get("arch")==arch and (r.get("published") or r.get("isPublished") or r.get("publishedAtUtc") or str(r.get("status","")).lower()=="published") for r in rows), "更新通道复核失败：未找到对应平台的已发布版本或发布状态不正确"'
            echo "更新通道已发布并复核通过：$VER ($OS-$ARCH)"
          done
