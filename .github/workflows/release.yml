# SuperSQLInjectionV2 GitHub Release 发布流水线
# 触发：推送 v* 标签（如 git tag v2.0.0 && git push origin v2.0.0）
# 流程：复用 desktop-aot / cli-aot 两个 workflow 构建 6 个平台包 → 汇总创建 GitHub Release
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 运行发布前单元测试
        run: dotnet test SuperSQLInjectionV2.Tests/SuperSQLInjectionV2.Tests.csproj -c Release
      - name: 校验Tag与程序版本一致
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VER="${TAG_NAME#v}"
          APP_VER=$(python3 -c "import re;print(re.search(r'AppVersion\s*=\s*\"([^\"]+)\"',open('SuperSQLInjectionV2/Models/ConstData.cs').read()).group(1))")
          test "$VER" = "$APP_VER" || { echo "::error::Tag $VER 与 ConstData.AppVersion $APP_VER 不一致"; exit 1; }
          python3 - "$VER" <<'PY'
          import pathlib,re,sys
          ver=sys.argv[1]
          for name in ['SuperSQLInjectionV2/SuperSQLInjectionV2.csproj','SuperSQLInjectionV2.Desktop/SuperSQLInjectionV2.Desktop.csproj','SuperSQLInjectionV2.Cmd/SuperSQLInjectionV2.Cmd.csproj']:
              text=pathlib.Path(name).read_text()
              actual=re.search(r'<Version>([^<]+)</Version>',text).group(1)
              assert actual == ver, f'{name}: {actual} != {ver}'
          PY

  # 桌面端三平台（复用 desktop-aot.yml）
  desktop:
    needs: validate
    uses: ./.github/workflows/desktop-aot.yml

  # 命令行三平台（复用 cli-aot.yml）
  cli:
    needs: validate
    uses: ./.github/workflows/cli-aot.yml

  # 汇总产物并创建 Release
  publish:
    needs: [desktop, cli]
    runs-on: ubuntu-latest
    steps:
      # 只下载正式产物；skill-input-* 是 cli-aot 内部合并 Skill 用的中间文件，不能混入 Release。
      - name: 下载桌面端构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: 'desktop-*'
          path: dist
          merge-multiple: true

      - name: 下载命令行构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: 'cli-*'
          path: dist
          merge-multiple: true

      - name: 下载双平台 Skill 包
        uses: actions/download-artifact@v4
        with:
          name: skill-cli
          path: dist
          merge-multiple: true

      - name: 产物清单
        run: ls -la dist/

      - name: 创建 GitHub Release 并附加安装包
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      # 同步到 SoftUpdate 更新通道（soft.shack2.cn）：注册草稿 → 发布上线。
      # 目前只同步 windows-x64 桌面包（客户端更新检测只按客户端平台匹配，历史版本同）。
      # 需要在仓库 Secrets 配置：UPDATE_SERVER_URL（如 http://soft.shack2.cn）、UPDATE_API_KEY（服务端 data/admin-apikey.txt）
      - name: 同步到 SoftUpdate 更新通道（windows-x64 桌面包）
        env:
          UPDATE_SERVER: ${{ secrets.UPDATE_SERVER_URL }}
          UPDATE_KEY: ${{ secrets.UPDATE_API_KEY }}
          TAG_NAME: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -e
          if [ -z "$UPDATE_SERVER" ] || [ -z "$UPDATE_KEY" ]; then
            echo "::error::必须配置 UPDATE_SERVER_URL / UPDATE_API_KEY Secrets，禁止发布流程静默跳过更新通道"
            exit 1
          fi
          VER="${TAG_NAME#v}"
          ZIP=$(ls dist/*desktop-win-x64.zip)
          echo "同步 $VER -> $UPDATE_SERVER （包：$ZIP）"
          RESP=$(curl -sf -X POST "$UPDATE_SERVER/api/admin/releases" \
            -H "X-Api-Key: $UPDATE_KEY" \
            -F appId=supersqlinjection -F "version=$VER" -F channel=stable \
            -F os=windows -F arch=x64 -F mandatory=false \
            -F "notes=$COMMIT_MSG" \
            -F "files=@$ZIP")
          echo "$RESP"
          ID=$(echo "$RESP" | python3 -c "import json,sys;print(json.load(sys.stdin)['id'])")
          curl -sf -X POST "$UPDATE_SERVER/api/admin/releases/$ID/publish" -H "X-Api-Key: $UPDATE_KEY"
          curl -sf "$UPDATE_SERVER/api/admin/releases?appId=supersqlinjection" -H "X-Api-Key: $UPDATE_KEY" \
            | ID="$ID" VER="$VER" python3 -c 'import json,sys,os; data=json.load(sys.stdin); rows=data if isinstance(data,list) else data.get("items",data.get("data",[])); rid=int(os.environ["ID"]); ver=os.environ["VER"]; assert any(str(r.get("id"))==str(rid) and r.get("version")==ver and (r.get("published") or r.get("isPublished") or r.get("publishedAtUtc") or r.get("status")=="published") for r in rows), "更新通道复核失败：未找到已发布版本或发布状态不正确"'
          echo "更新通道已发布并复核通过：$VER"
