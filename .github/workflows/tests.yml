name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: 还原依赖
        run: dotnet restore SuperSQLInjectionV2.sln
      - name: 运行单元测试
        run: dotnet test SuperSQLInjectionV2.Tests/SuperSQLInjectionV2.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=tests.trx"
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: SuperSQLInjectionV2.Tests/TestResults/
          if-no-files-found: ignore
