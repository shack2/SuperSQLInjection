# SuperSQLInjectionV2.Cmd osx-arm64 Native AOT 构建（Native AOT 不支持跨 OS 交叉编译，借 macos runner 出 mac 包）
# 手动触发：Actions → cli-aot-osx → Run workflow；产物在 Artifacts 与 release/2.0.0/cli-osx-arm64
name: cli-aot-osx

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 编译 osx-arm64 Native AOT
        run: |
          chmod +x publish-cli-aot-osx.sh
          ./publish-cli-aot-osx.sh

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SuperSQLInjectionV2.Cmd-osx-arm64
          path: release/2.0.0/cli-osx-arm64/
