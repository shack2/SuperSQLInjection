# SuperSQLInjectionV2 桌面端（Avalonia GUI）三平台 Native AOT 编译打包
# 手动触发：Actions → desktop-aot → Run workflow；产物在 Artifacts
# 也被 release.yml 以 workflow_call 复用（打 tag 发布时自动构建）
# 注：Native AOT 不支持跨 OS 交叉编译，三平台分别用对应 runner 本机编译
name: desktop-aot

on:
  workflow_dispatch:
  workflow_call:

env:
  # 发版时由 tag 名自动取版本（refs/tags/v2.0.3 → v2.0.3）；手动触发时为 0.0.0-dev
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '0.0.0-dev' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, rid: win-x64 }
          - { os: ubuntu-latest,  rid: linux-x64 }
          - { os: macos-14,       rid: osx-arm64 }   # Apple Silicon；Intel Mac 需 macos-13 + osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 安装 Linux Native AOT 编译依赖
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # macOS 默认 Xcode 太旧会缺 swift_Builtin_float 等新版 Swift 运行时库，
      # 导致 Native AOT 链接报 Undefined symbols __swift_FORCE_LOAD_$_swift_*，这里切到 runner 上最新 Xcode
      - name: 切换到最新 Xcode（仅 macOS）
        if: runner.os == 'macOS'
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | tail -1)
          [ -z "$XCODE" ] && XCODE="/Applications/Xcode.app"
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: 编译桌面端 Native AOT（${{ matrix.rid }}）
        run: dotnet publish SuperSQLInjectionV2.Desktop/SuperSQLInjectionV2.Desktop.csproj -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:PublishTrimmed=true --self-contained

      - name: 清理调试符号与异平台 quickjs 库
        shell: bash
        run: |
          PUBDIR="SuperSQLInjectionV2.Desktop/bin/Release/net10.0/${{ matrix.rid }}/publish"
          rm -f "$PUBDIR"/*.pdb "$PUBDIR"/*.dbg "$PUBDIR"/*.dwarf 2>/dev/null || true
          # 只保留本平台的 libquickjs，剔除异平台库（约省 8MB）
          case "${{ matrix.rid }}" in
            win-x64)   rm -f "$PUBDIR/libquickjs.so" "$PUBDIR/libquickjs.dylib"
                       # ANGLE OpenGL ES 后备渲染库：Windows 默认走 D3D11 不需要（约省 5MB）
                       rm -f "$PUBDIR/av_libglesv2.dll";;
            linux-x64) rm -f "$PUBDIR/libquickjs.dll" "$PUBDIR/libquickjs.dylib";;
            osx-arm64) rm -f "$PUBDIR/libquickjs.dll" "$PUBDIR/libquickjs.so";;
          esac
          ls -la "$PUBDIR"

      - name: 打包 zip（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $pub = "SuperSQLInjectionV2.Desktop/bin/Release/net10.0/${{ matrix.rid }}/publish"
          # 随包附带文档（使用手册/更新说明/界面截图）与README
          Copy-Item -Recurse doc "$pub/doc"
          Copy-Item README.md "$pub/README.md"
          Compress-Archive -Path "$pub/*" -DestinationPath "dist/SuperSQLInjectionV2-$($env:VERSION -replace '^v','')-desktop-${{ matrix.rid }}.zip" -Force

      - name: 打包 tar.gz（Linux）
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p dist
          PUBDIR="SuperSQLInjectionV2.Desktop/bin/Release/net10.0/${{ matrix.rid }}/publish"
          # 随包附带文档（使用手册/更新说明/界面截图）与README
          cp -R doc "$PUBDIR/doc"
          cp README.md "$PUBDIR/README.md"
          tar -czf "dist/SuperSQLInjectionV2-${VERSION#v}-desktop-${{ matrix.rid }}.tar.gz" -C "$PUBDIR" .

      # macOS 桌面端按平台惯例打 .app Bundle 再封装 .dmg：
      # publish 产物整体进 Contents/MacOS/，Info.plist 声明可执行名/版本/最低系统，
      # iconutil 由 build/AppIcon.png 生成 icns，codesign 做 ad-hoc 签名（Apple Silicon 要求所有代码至少 ad-hoc 签名）
      - name: 打包 .app + .dmg（macOS）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -e
          PUBDIR="SuperSQLInjectionV2.Desktop/bin/Release/net10.0/${{ matrix.rid }}/publish"
          APP="dist/SuperSQLInjectionV2.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp -R "$PUBDIR"/. "$APP/Contents/MacOS/"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key>
              <string>SuperSQLInjectionV2</string>
              <key>CFBundleDisplayName</key>
              <string>超级SQL注入工具V2</string>
              <key>CFBundleIdentifier</key>
              <string>com.shack2.supersqlinjectionv2</string>
              <key>CFBundleVersion</key>
              <string>${VERSION#v}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION#v}</string>
              <key>CFBundleExecutable</key>
              <string>SuperSQLInjectionV2.Desktop</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>13.0</string>
              <key>NSHighResolutionCapable</key>
              <true/>
          </dict>
          </plist>
          EOF
          ICONSET="dist/AppIcon.iconset"
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z $s $s build/AppIcon.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            sips -z $((s*2)) $((s*2)) build/AppIcon.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"
          # Contents/MacOS 下的非代码内容会被 codesign 误判为"嵌套代码"导致签名失败
          # （曾先后在 config/udf 的UDF库目录、config/vers/oracle.txt 上踩坑）。
          # 根治：MacOS 下所有子目录（config/ 等纯数据目录）整体迁入 Contents/Resources，原位留相对符号链接——
          # 应用按 AppDomain.BaseDirectory/config 访问，.NET 透明跟随符号链接，读写均不受影响。
          shopt -s nullglob
          for d in "$APP/Contents/MacOS"/*/; do
            name=$(basename "$d")
            mv "$d" "$APP/Contents/Resources/$name"
            ln -s "../Resources/$name" "$APP/Contents/MacOS/$name"
          done
          # 防御：MacOS 顶层非 dylib/主程序的文件剥掉执行位（带 +x 的数据文件同样触发嵌套代码判定）
          find "$APP/Contents/MacOS" -maxdepth 1 -type f ! -name "*.dylib" ! -name "SuperSQLInjectionV2.Desktop" -exec chmod -x {} +
          # ad-hoc 签名：逐个签 dylib/主程序（Apple Silicon 要求所有代码至少 ad-hoc 签名），最后签整个 bundle 并校验
          find "$APP/Contents/MacOS" -maxdepth 1 \( -name "*.dylib" -o -type f -perm +111 \) -exec codesign --force --sign - {} \;
          codesign --force --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # dmg 内容= .app + doc/ + README.md（文档不进 .app 内部，打开 dmg 即见；放 MacOS 目录会破坏签名密封）
          STAGE="dist/dmg-stage"
          mkdir -p "$STAGE"
          mv "$APP" "$STAGE/"
          cp -R doc "$STAGE/doc"
          cp README.md "$STAGE/README.md"
          hdiutil create -volname "SuperSQLInjectionV2" -srcfolder "$STAGE" -ov -format UDZO "dist/SuperSQLInjectionV2-${VERSION#v}-desktop-${{ matrix.rid }}.dmg"
          rm -rf "$STAGE" "$ICONSET"
          ls -la dist/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.rid }}
          path: dist/
          retention-days: 30
